name: modern-suite

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install R, Chrome, Java 17+, and Xvfb
        run: |
          sudo apt-get update
          # OculiX 4.0.0 is Java 17 bytecode. OpenJDK 21 satisfies that. A SikuliX jar can still run on Java 8.
          sudo apt-get install -y r-base-core xvfb openjdk-21-jre
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          wget -q -O /tmp/oculixide-4.0.0-linux.jar https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-linux.jar
          Rscript --version
          google-chrome-stable --version
          java -version
          test "$(wc -c < /tmp/oculixide-4.0.0-linux.jar)" = "197708979"
      - name: Logic checks and live mode
        env:
          TAGUI_CHROME_ISOLATED: "1"
        run: |
          php src/test/test_modern_logic.php
          python3 src/test/test_modern_live.py
      - name: Official suite on the modern engine
        env:
          TAGUI_CHROME_ISOLATED: "1"
          TAGUI_SIKULI_JAR: /tmp/oculixide-4.0.0-linux.jar
        run: php src/test/test_modern_suite.php
